[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "portfolio-website"
version = "0.1.0"
description = "A portfolio website served by Flask from a SQLite database (Day 83 of 100 Days of Code)."
readme = "README.md"
requires-python = ">=3.13"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Jens Tirsvad Nielsen" }]
keywords = ["portfolio", "flask", "sqlite", "python", "100-days-of-code"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.13",
  "Topic :: Internet :: WWW/HTTP :: Site Management",
]
# Flask is the only runtime dependency, pinned to an exact version (ADR-0003).
dependencies = ["Flask==3.1.3"]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.8",
  "mypy>=1.13",
  "import-linter>=2.1",
]

[tool.setuptools.packages.find]
where = ["src"]

# The templates and the stylesheet are read at run time by Flask.
[tool.setuptools.package-data]
"portfolio.presentation" = ["templates/*.html", "static/*.css"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
# tests/unit holds the shared builders and fakes (sample_data.py, fakes.py).
pythonpath = ["src", "tests/unit"]
addopts = "-ra"

[tool.ruff]
line-length = 88
target-version = "py313"
src = ["src", "tests", "tests/unit"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "S", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# S311: the tests seed random.Random on purpose, to get a reproducible sample.
"tests/**" = ["S101", "S311"]

[tool.mypy]
strict = true
python_version = "3.13"
mypy_path = ["src", "tests/unit"]
files = ["src", "tests"]

# The layers of src/portfolio, from top to bottom: a layer imports only layers
# below it. The composition root (__main__) is outside the layers and wires them.
[tool.importlinter]
root_package = "portfolio"
# Needed for the contract that keeps flask and jinja2 out of the inner layers.
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Dependencies point inward"
type = "layers"
layers = [
  "portfolio.presentation",
  "portfolio.infrastructure",
  "portfolio.application",
  "portfolio.domain",
]

[[tool.importlinter.contracts]]
name = "The domain imports no other layer"
type = "forbidden"
source_modules = ["portfolio.domain"]
forbidden_modules = [
  "portfolio.application",
  "portfolio.infrastructure",
  "portfolio.presentation",
]

[[tool.importlinter.contracts]]
name = "Presentation does not import infrastructure"
type = "forbidden"
source_modules = ["portfolio.presentation"]
forbidden_modules = ["portfolio.infrastructure"]

[[tool.importlinter.contracts]]
name = "Infrastructure does not import presentation"
type = "forbidden"
source_modules = ["portfolio.infrastructure"]
forbidden_modules = ["portfolio.presentation"]

[[tool.importlinter.contracts]]
name = "The domain and application layers import no web framework"
type = "forbidden"
source_modules = ["portfolio.domain", "portfolio.application"]
forbidden_modules = ["flask", "jinja2"]
