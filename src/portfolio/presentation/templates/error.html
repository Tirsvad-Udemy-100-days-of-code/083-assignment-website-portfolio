{% block title %}{{ status }} {{ reason }}{% endblock %}
{% block content %}

      <h1>{{ status }} {{ reason }}</h1>
      <p>{{ message }}</p>
      <p><a href="{{ url_for('home') }}">{{ error_home_link_text }}</a></p>
    </section>
{% endblock %}
